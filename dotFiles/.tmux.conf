### --- Split shortcuts --- ###
# Vertical split with |
bind | split-window -h
# Horizontal split with -
bind - split-window -v

# Unbind the default split keys
unbind '"'
unbind %

### --- Better status bar --- ###
# Enable status bar
set -g status on
set -g status-interval 1

# Status bar colors
set -g status-bg black
set -g status-fg white
set -g status-style "bg=black,fg=white"

### --- Active window highlight --- ###
setw -g window-status-current-style "bg=blue,fg=white,bold"
setw -g window-status-current-format " #I:#W* "

### --- Inactive windows --- ###
setw -g window-status-style "bg=black,fg=grey"
setw -g window-status-format " #I:#W "

### --- Pane border styling --- ###
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=yellow"

### --- Show pane numbers briefly --- ###
bind-key q display-panes

### --- Mouse support (optional but helpful) --- ###
set -g mouse on

