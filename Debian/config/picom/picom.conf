backend = "xrender";

# ───── Opacity ─────
#active-opacity = 0.95;
#inactive-opacity = 1.0;
#frame-opacity = 0.90;
#inactive-dim = 0.0;

# ───── Rules ─────

# ───── Per-window transparency only ─────
opacity-rule = [
  "92:class_g = 'Alacritty'",
  "92:class_g = 'kitty'",
  "92:class_g = 'URxvt'",
  "90:class_g = 'Polybar'"
];

# ───── Fading ─────
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;


# ───── Rounded corners ─────
corner-radius = 10;

rounded-corners-exclude = [
  "class_g = 'Polybar'"
];
