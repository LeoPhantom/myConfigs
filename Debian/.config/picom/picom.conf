#################################
# General Settings
#################################

# Use the X Render extension for compositing.
# This is the most compatible and safest option for VMs without proper
# 3D acceleration (OpenGL/GLX).
backend = "xrender"; 

# This is also important for Alacritty to use its own opacity setting!
detect-client-opacity = true; 

# Optional: Disable resource-intensive effects
shadow = false;
fading = false;

#################################
# Transparency / Opacity
#################################

# Default opacity for active (focused) windows.
active-opacity = 1.0; 

# Default opacity for inactive (unfocused) windows.
inactive-opacity = 0.9; 

# Opacity of window titlebars and borders (if your WM draws them).
frame-opacity = 1.0; 

# NOTE: Picom's values are 0.0 (transparent) to 1.0 (opaque).
